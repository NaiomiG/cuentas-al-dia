<!doctype html>
<html lang="es"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Cuentas">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Cuentas al Día</title>
<script>window.PDF_WORKER="pdf.worker.min.js"</script>
<script src="pdf.min.js"></script>
<style>
@font-face{font-family:"Figtree";font-style:normal;font-weight:300 900;font-display:swap;src:url(figtree.woff2) format("woff2")}
@font-face{font-family:"Bricolage Grotesque";font-style:normal;font-weight:200 800;font-display:swap;src:url(bricolage.woff2) format("woff2")}
main{padding-top:calc(24px + env(safe-area-inset-top,0px))}
/* Concepto: blanco, una columna, sin tarjetas. Un número, listas con la fecha a la izquierda, barra inferior de 4 pestañas.
   Un solo verde de acento; ámbar y rojo solo para avisos. */
:root{
  --bg:#FFFFFF; --surface:#FFFFFF; --surface2:#F4F7F5; --ink:#16201B; --muted:#5F6A64; --ring:#8A938D; --line:#E7EBE8;
  --accent:#1F6F4A; --accent-ink:#FFFFFF; --accent-soft:#E3F0E8;
  --good:#1F6F4A; --good-soft:#E3F0E8; --warn:#955700; --warn-soft:#FBEFD9; --bad:#B3361B; --bad-soft:#FBE6E0;
  --f-display:"Bricolage Grotesque","Figtree",system-ui,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
::selection{background:var(--accent-soft);color:var(--ink)}
html{scrollbar-width:thin;scrollbar-color:var(--line) transparent}
body{background:var(--bg);color:var(--ink);font:16px/1.45 var(--f-body);margin:0;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance}
h2{display:flex;justify-content:space-between;align-items:baseline;gap:4px 12px;flex-wrap:wrap}
h2+.balrow,h2+.kv{border-top:0}
.box>h2{margin-bottom:6px}
h1{font-weight:600;font-size:28px;line-height:1.1;letter-spacing:-.02em}
h2{font-weight:600;font-size:20px;line-height:1.2;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:8px}
.n{font-variant-numeric:tabular-nums}
.shell{min-height:100vh}
main{padding:24px 24px 128px;max-width:568px;width:100%;margin-inline:auto;min-width:0}
main>*+*{margin-top:36px}
main>.back+*{margin-top:4px}
.row.rec{grid-template-columns:1fr auto}

nav.rail{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--bg);border-top:1px solid var(--line);padding:8px 16px calc(env(safe-area-inset-bottom,0px) + 8px)}
nav.rail:empty{display:none}
nav.rail .bar{max-width:520px;margin-inline:auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav.rail button{display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:0;padding:6px 0;color:var(--muted);font-size:11.5px;font-weight:500}
nav.rail button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
nav.rail button[aria-current="page"]{color:var(--accent);font-weight:600}

.top{display:flex;gap:12px;align-items:center;justify-content:space-between}
.top p{margin:4px 0 0;color:var(--muted);font-size:15px}
.back{background:none;border:0;padding:0 0 12px;color:var(--accent);font-weight:600;font-size:15px}
.hb{display:flex;gap:8px;flex:none}
#main[data-sub] .more{display:none}
.plus{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--bg);display:grid;place-items:center;flex:none;transition:transform .12s ease-out,background .15s}
.plus:hover{background:var(--surface2)} .plus:active{transform:scale(.94)}
.plus svg{width:18px;height:18px;stroke:var(--ink);stroke-width:1.8;stroke-linecap:round;fill:none}

.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:999px;padding:11px 20px;font-weight:600;white-space:nowrap;transition:transform .12s ease-out,filter .15s}
.btn:hover{filter:brightness(1.1)} .btn:active{transform:scale(.97)}
.btn.sm{padding:6px 14px;font-size:14px}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.ghost:hover{background:var(--surface2);filter:none}
.btn.navy{background:var(--ink);color:var(--bg)}
.btn.bad{background:var(--bad);color:#fff}
.btn.bad-t{color:var(--bad);border-color:transparent;background:none}
.link{background:none;border:0;padding:0;color:var(--accent);font-weight:600;font-size:15px;text-underline-offset:4px}
.link:hover{text-decoration:underline}

/* hoy */
.hero{display:flex;flex-direction:column;gap:12px}
.hero .big{font:600 clamp(60px,18vw,88px)/.95 var(--f-display);letter-spacing:-.035em;font-variant-numeric:tabular-nums}
.hero .big.neg{color:var(--bad)}
.hero p{margin:0;color:var(--muted);font-size:17px;max-width:32ch;text-wrap:balance}
.hero p b{color:var(--ink);font-weight:600}
.hero .sub{font-size:15px;max-width:none}
.aviso{font-size:15px;color:var(--warn);margin:0}
.aviso.bad{color:var(--bad)}
.aviso button{all:unset;cursor:pointer;text-decoration:underline;text-underline-offset:3px;margin-left:6px;font-weight:600}
.lista>h2{margin-bottom:4px;display:flex;justify-content:space-between;align-items:baseline;gap:4px 10px;flex-wrap:wrap}
.lista>h2 small,.sect>h2 small{font:500 13.5px var(--f-body);color:var(--muted)}
.sect>h2{margin-bottom:6px;display:flex;justify-content:space-between;align-items:baseline;gap:4px 10px;flex-wrap:wrap}

/* filas */
.row{display:grid;grid-template-columns:48px 1fr auto 32px;align-items:center;column-gap:14px;padding-block:16px;border-bottom:1px solid var(--line);transition:opacity .3s}
.row.nochk{grid-template-columns:48px 1fr auto}
.rdate{text-align:center;line-height:1.1}
.rdate b{display:block;font:600 22px/1 var(--f-display);letter-spacing:-.02em}
.rdate small{font-size:12.5px;color:var(--muted)}
.row.soon .rdate b{color:var(--warn)}
.row.over .rdate b{color:var(--bad)}
.rmain{min-width:0;background:none;border:0;padding:0;text-align:left;font:inherit;cursor:pointer}
.rname{font-weight:600;overflow-wrap:anywhere}
.rsub{color:var(--muted);font-size:14px;overflow-wrap:anywhere}
.ramt{font-weight:600;text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.ramt.in{color:var(--good)}
.ract{grid-column:2 / -1;display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:2px}
.ract .link{color:var(--muted);font-weight:500;font-size:14px}
.chk{width:32px;height:32px;border-radius:50%;border:1.6px solid var(--ring);background:none;display:grid;place-items:center;padding:0;transition:background .2s,border-color .2s,transform .12s ease-out}
.chk:hover{border-color:var(--accent)} .chk:active{transform:scale(.9)}
.chk svg{width:16px;height:16px;stroke:#fff;fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:22;stroke-dashoffset:22;transition:stroke-dashoffset .25s ease .05s}
.row.done{opacity:.5}
.row.done .rname{text-decoration:line-through;text-decoration-color:var(--ring)}
.row.done .chk{background:var(--accent);border-color:var(--accent)}
.row.done .chk svg{stroke-dashoffset:0}
.tag{display:inline-block;white-space:nowrap;background:var(--surface2);border-radius:999px;padding:0 9px;margin-right:6px;font-size:12px;color:var(--muted)}
.tag.dom,.tag.ok{background:var(--accent-soft);color:var(--accent)}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.more{display:inline-block;margin-top:16px}

.owed{display:grid;grid-template-columns:1fr auto 20px;align-items:center;column-gap:12px;width:100%;text-align:left;padding:18px 20px;border-radius:18px;background:var(--surface2);border:0;transition:transform .12s ease-out}
.owed:active{transform:scale(.985)}
.owed .a{font-weight:600;font-size:18px;color:var(--accent);font-variant-numeric:tabular-nums}
.owed .a.bad{color:var(--bad)}
.owed svg,.go svg{width:18px;height:18px;stroke:var(--muted);stroke-width:1.8;fill:none;stroke-linecap:round;stroke-linejoin:round}
.go{display:grid;grid-template-columns:1fr 20px;align-items:center;column-gap:12px;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:18px 0}
.go .t{font-weight:600}
.go .s{color:var(--muted);font-size:14px}
.demo-b{background:var(--warn-soft);color:var(--warn);border-radius:14px;padding:12px 16px;display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap;font-size:14.5px}
.demo{margin:0;color:var(--muted);font-size:13px}

/* bloques generales */
.box{background:var(--surface2);border-radius:18px;padding:18px;min-width:0}
.kv{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line);font-size:15px}
.kv:first-child{border-top:0}
.kv>span:first-child{color:var(--muted)}
.prog{height:6px;border-radius:999px;background:var(--line);overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);border-radius:999px}
.prog.good i{background:var(--good)} .prog.warn i{background:var(--warn)} .prog.bad i{background:var(--bad)}
.bud{margin-bottom:16px}
.bud .kv{border:0;padding:0 0 6px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:24px}
.stat b{display:block;font:600 28px/1.1 var(--f-display);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.stat span{display:block;color:var(--muted);font-size:14px;margin-top:2px}
.stat.good b{color:var(--good)} .stat.warn b{color:var(--warn)} .stat.bad b{color:var(--bad)}
.pill{display:inline-block;border-radius:999px;padding:1px 10px;font-size:12.5px;font-weight:600}
.pill.good{background:var(--good-soft);color:var(--good)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.info{background:var(--surface2);color:var(--muted)}
.mnav{display:flex;align-items:center;gap:6px}
.mnav b{font:600 20px var(--f-display);letter-spacing:-.01em;min-width:130px;text-align:center;text-transform:capitalize}
.seg{display:inline-flex;background:var(--surface2);border-radius:999px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{background:none;border:0;padding:7px 16px;border-radius:999px;font-weight:600;font-size:14.5px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.chart{width:100%;height:auto;display:block}
.chart text{font:11px var(--f-body);fill:var(--muted)}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart .zero{stroke:var(--muted);stroke-width:1;stroke-dasharray:3 3}
.chart .ln{fill:none;stroke:var(--accent);stroke-width:2.4;stroke-linejoin:round}
.chart .ar{fill:var(--accent-soft);opacity:.8}
.chart .neg{fill:var(--bad)}
.chart .mn{fill:var(--bg);stroke:var(--ink);stroke-width:1.5}
.chips{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)} .small{font-size:14px}
.empty{color:var(--muted);padding:28px 0;text-align:center}
.empty b{display:block;color:var(--ink);font:600 18px var(--f-display);margin-bottom:4px}
.alert{border-radius:14px;padding:12px 16px;font-size:15px;margin-bottom:10px}
.alert.bad{background:var(--bad-soft);color:var(--bad)} .alert.warn{background:var(--warn-soft);color:var(--warn)} .alert.good{background:var(--good-soft);color:var(--good)} .alert.info{background:var(--surface2);color:var(--muted)}
.alert button{all:unset;cursor:pointer;text-decoration:underline;margin-left:6px}
.tools{display:flex;flex-direction:column;gap:40px}
.grid{display:grid;gap:20px}
.g2,.g3{grid-template-columns:1fr}
.linkline{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap;background:var(--surface2);border-radius:16px;padding:14px 18px}

/* tarjetas */
.cardface{border-radius:22px;padding:20px;color:#fff;position:relative;overflow:hidden;min-height:168px;display:flex;flex-direction:column;justify-content:space-between;background:var(--c1);width:100%;text-align:left;border:0}
.cardface::after{content:"";position:absolute;right:-50px;top:-50px;width:170px;height:170px;border-radius:50%;background:rgba(255,255,255,.1)}
.cardface .nm{font:600 20px var(--f-display);position:relative;z-index:1;display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.cardface .chip{width:34px;height:25px;border-radius:6px;background:rgba(255,255,255,.5);flex:none}
.cardface .bal{font:600 32px var(--f-display);letter-spacing:-.02em;position:relative;z-index:1;font-variant-numeric:tabular-nums}
.cardface small{display:block;opacity:.85;font-size:13px;position:relative;z-index:1}
.cardface .prog{background:rgba(255,255,255,.28);margin-top:8px;position:relative;z-index:1}
.cardface .prog i{background:#fff}
.cardface .cn{display:flex;align-items:center;gap:9px;min-width:0}.mono{width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.22);display:inline-grid;place-items:center;font:700 11px var(--f-body);letter-spacing:.02em;flex:none}
.cardface.cx{background:linear-gradient(135deg,var(--c1),var(--c2));color:var(--ct,#fff)}
.cardface.cx .prog i{background:var(--ct,#fff)}
.cardface.lt::after{background:rgba(0,0,0,.06)}.cardface.lt .mono{background:rgba(0,0,0,.12)}.cardface.lt .chip{background:rgba(0,0,0,.25)}.cardface.lt .prog{background:rgba(0,0,0,.14)}
.sw2row{display:flex;flex-wrap:wrap;gap:10px;margin:12px 0 4px;align-items:center}.sw2{width:36px;height:36px;border-radius:50%;border:2px solid var(--bg);box-shadow:0 0 0 1px var(--line)}.sw2row .sep{width:1px;height:26px;background:var(--line)}
.pick2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}.pick2 label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}.pick2 input[type=color]{width:100%;height:44px;padding:2px;border-radius:12px;border:1px solid var(--line);background:var(--surface2)}
.c-navy{--c1:#16201B} .c-rosa{--c1:#A5472B} .c-teal{--c1:#1F6F4A} .c-oro{--c1:#9A7410} .c-grafito{--c1:#4B5550}
.cols{display:flex;align-items:flex-end;gap:5px;height:130px;margin-top:6px}
.cols div{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;gap:4px}
.cols i{display:block;width:100%;background:var(--accent);border-radius:5px 5px 0 0;min-height:2px}
.cols small{font-size:11px;color:var(--muted);text-transform:capitalize}
.cols em{font:600 10.5px var(--f-body);color:var(--muted);font-style:normal}
.msi{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:12px 0;border-top:1px solid var(--line);font-size:15px;align-items:center}
.msi>div:first-child b{display:block}
.msi .prog{grid-column:1 / -1;height:5px;margin-top:6px}

/* tablas y formularios */
.tbl{overflow-x:auto}
.tbl table{border-collapse:collapse;width:100%;min-width:520px;font-size:14.5px}
.tbl th{font-size:13px;color:var(--muted);text-align:left;padding:8px;font-weight:600}
.tbl td{padding:10px 8px;border-top:1px solid var(--line);vertical-align:top}
.tbl td.r,.tbl th.r{text-align:right}
.tbl td:nth-child(3) input{min-width:230px}
.tbl td:nth-child(2){white-space:nowrap}
.tbl input[type=text],.tbl select{width:100%;min-width:90px;background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:6px 8px}
.scrim{position:fixed;inset:0;background:rgba(22,32,27,.45);z-index:40}
.sheet{position:fixed;z-index:41;left:0;right:0;bottom:0;max-height:92vh;overflow:auto;background:var(--bg);border-radius:24px 24px 0 0;padding:22px 22px calc(22px + env(safe-area-inset-bottom,0px));box-shadow:0 -10px 40px rgba(0,0,0,.12)}
@media(min-width:640px){.sheet{left:50%;right:auto;bottom:auto;top:50%;transform:translate(-50%,-50%);width:520px;max-width:calc(100vw - 32px);border-radius:24px}}
.sheet-h{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}
.sheet-h h2{font-size:22px}
.note{margin:0 0 14px;color:var(--muted);font-size:14.5px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld.full{grid-column:1 / -1}
@media(max-width:480px){.fgrid{grid-template-columns:1fr}}
.fld>label{font-size:14px;color:var(--muted);font-weight:500}
.fld input,.fld select,textarea{background:var(--surface2);border:1.5px solid transparent;border-radius:12px;padding:11px 13px;width:100%;min-width:0}
.fld input:focus,.fld select:focus,textarea:focus{border-color:var(--accent);outline:none}
.fld input[type=checkbox]{width:auto}
.fld small{color:var(--muted);font-size:13px}
.chk-l{display:flex;gap:8px;align-items:center;color:var(--ink)!important;font-size:15px!important}
.err{color:var(--bad);margin:12px 0 0;font-size:14.5px}
.sheet-f{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:18px;flex-wrap:wrap}
textarea{min-height:100px;font-size:14px}
.menu{display:flex;flex-direction:column}
.menu button{display:grid;grid-template-columns:1fr 20px;align-items:center;gap:12px;background:none;border:0;border-bottom:1px solid var(--line);padding:16px 0;text-align:left}
.menu button:last-child{border-bottom:0}
.menu .t{font-weight:600} .menu .s{color:var(--muted);font-size:14px}
.menu svg{width:18px;height:18px;stroke:var(--muted);stroke-width:1.8;fill:none;stroke-linecap:round;stroke-linejoin:round}

/* avisos al pie */
#toast{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 84px);display:flex;justify-content:center;z-index:60;pointer-events:none;padding:0 16px}
.toast{background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:14px;font-size:14.5px;display:flex;gap:16px;align-items:center;max-width:100%;pointer-events:auto;animation:up .22s ease-out}
.toast button{background:none;border:0;padding:0;font-weight:700;color:var(--toast-link,#BFE3CE);text-decoration:underline;text-underline-offset:3px}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

.welcome{max-width:520px;margin:9vh auto;padding:0 24px}
.welcome h1{font-size:clamp(40px,11vw,60px);margin-bottom:16px;letter-spacing:-.03em}
.welcome p{color:var(--muted);font-size:17px;max-width:46ch}
.welcome ul{padding-left:20px;color:var(--muted)}
.welcome .acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}
.drop{border:2px dashed var(--line);border-radius:18px;padding:28px 16px;text-align:center;color:var(--muted)}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.avatar{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font:600 13px var(--f-display);margin-right:-6px;border:2px solid var(--bg)}
.balrow{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;padding:14px 0;border-top:1px solid var(--line)}
.balrow:first-child{border-top:0}
.balrow .who{font-weight:600}
.balrow .st{font:600 18px var(--f-display);font-variant-numeric:tabular-nums}
.balrow .st.pos{color:var(--good)} .balrow .st.neg{color:var(--bad)}
.balrow .ac{grid-column:1 / -1;display:flex;gap:6px;flex-wrap:wrap}
.led{display:grid;grid-template-columns:70px 1fr auto auto;gap:2px 12px;padding:10px 0;border-top:1px solid var(--line);font-size:14.5px;align-items:baseline}
.led:first-child{border-top:0}
.led .d{color:var(--muted);font-size:13px}
@media(max-width:560px){.led{grid-template-columns:62px 1fr auto}.led .run{grid-column:2 / -1;color:var(--muted);font-size:13px;text-align:left!important}}
.led .amt{font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
.led .run{font-size:13.5px;color:var(--muted);text-align:right;min-width:90px}
.sub-pay{grid-column:2 / -1;font-size:13px;color:var(--muted)}
main h2 small{font:500 13.5px var(--f-body);color:var(--muted)}

/* ===== recurrencias ===== */
const FREQ=[['mensual','Cada mes'],['quincenal','Quincenal (día 15 y último)'],['semanal','Cada semana'],['catorcenal','Cada 14 días'],['bimestral','Cada 2 meses'],['unica','Una sola vez']];
function occ(it,from,to){
  const out=[],f=it.freq,anchor=it.fecha||todayISO();
  if(it.hasta&&it.hasta<to)to=it.hasta;
  if(from>to)return out;
  if(f==='unica'){if(anchor>=from&&anchor<=to)out.push(anchor);return out}
  if(f==='semanal'||f==='catorcenal'){
    const step=f==='semanal'?7:14;let n=dnum(anchor);const s=dnum(from),e=dnum(to);
    if(n<s)n+=Math.ceil((s-n)/step)*step;
    for(;n<=e;n+=step)out.push(fromNum(n));return out}
  for(const [y,m] of monthsBetween(from,to)){
    let ds=[];

function cardInst(c,from,to){
  const t=todayISO();let base=addDays(t,-60);if(c.desde&&c.desde>base)base=c.desde;
  const dates=[];
  if(!(+c.corte>=1)){if((+c.balance||0)>0){const d=addDays(t,+c.diasPago||20);if(d>=from&&d<=to)dates.push(d)}}

  const dp=+c.diasPago||20,msiNow=(c.msi||[]).filter(p=>p.remaining>0).reduce((x,p)=>x+msiMensual(p),0),msiPend=(c.msi||[]).filter(p=>p.remaining>0).reduce((x,p)=>x+msiMensual(p)*p.remaining,0);

    const key=`k:${c.id}:${d}`,rec=S.paid[key];let amount,est=false;

      const closed=addDays(d,-dp)<=t;

      if(first&&(+c.statement>0))amount=+c.statement;

      first=false;k++}
    if(d>=from)out.push({key,kind:'card',ref:c,date:d,name:'Tarjeta '+c.nombre,sub:'',amount,est,tipo:'egreso',cat:'Deuda',grupo:'Tarjetas',rec});
  }
  return out;
}

const cardOf=id=>S.cards.find(c=>c.id===id);
function payInst(i,{monto,fecha,noCash,cuenta}){
  if(S.paid[i.key])return null;
  const sign=i.tipo==='ingreso'?1:-1,rec={monto,fecha,mov:uid(),noCash:!!noCash};
  let metodo='cuenta';
  if(i.kind==='card'){const c=i.ref;rec.prev={balance:c.balance,statement:c.statement};rec.msi=(c.msi||[]).filter(p=>p.remaining>0).map(p=>p.id);(c.msi||[]).forEach(p=>{if(p.remaining>0)p.remaining--});c.balance=Math.max(0,(+c.balance||0)-monto);c.statement=0}
  const via=i.kind==='item'&&i.tipo==='egreso'&&isCardMedio(i.ref.medio)?cardOf(i.ref.medio):null;
  if(via){rec.viaCard=via.id;via.balance=(+via.balance||0)+monto;metodo=via.id}
  else if(!noCash){const cid=cuenta||(i.kind==='item'?(i.tipo==='ingreso'?i.ref.destino:i.ref.medio):null);rec.cuenta=moveCash(sign*monto,cid)}
  const it=i.kind==='item'?i.ref:null,ac=rec.cuenta?acc(rec.cuenta):null;
  const mv={id:rec.mov,fecha,tipo:i.tipo==='ingreso'?'ingreso':'egreso',monto,cat:i.kind==='card'?'Deuda':(i.cat||'Ingreso'),desc:i.name,metodo,key:i.key};
  if(rec.cuenta)mv.cuenta=rec.cuenta;

  if(it&&it.tipo==='egreso'&&RUBRO_GRUPO[it.grupo])mv.rubro=RUBRO_GRUPO[it.grupo];

}
function undoInst(key){
  const rec=S.paid[key];if(!rec)return;
  const m=S.movs.find(x=>x.id===rec.mov);const sign=m&&m.tipo==='ingreso'?1:-1;
  if(rec.viaCard){const c=cardOf(rec.viaCard);if(c)c.balance=Math.max(0,c.balance-rec.monto)}
  else if(!rec.noCash)moveCash(-sign*rec.monto,rec.cuenta);

  if(rec.prev){const c=cardOf(key.split(':')[1]);if(c){c.balance=rec.prev.balance;c.statement=rec.prev.statement;(rec.msi||[]).forEach(id=>{const p=(c.msi||[]).find(p=>p.id===id);if(p)p.remaining++})}}

/* ===== proyección y métricas ===== */
function project(days,pend){
  const t=todayISO();
  if(!pend)pend=instances(addDays(t,-90),addDays(t,days)).filter(i=>!isDone(i));
  const byDay={};
  for(const i of pend){
    if(i.date<t&&!S.contarVencidos)continue;
    const d=i.date<t?t:i.date;if(d>addDays(t,days))continue;
    const viaCard=i.kind==='item'&&isCardMedio(i.ref.medio);
    const sgn=i.tipo==='egreso'?-1:1;
    (byDay[d]=byDay[d]||[]).push({i,delta:viaCard?0:sgn*i.amount});
  }
  let bal=S.cash;const pts=[];
  for(let n=0;n<=days;n++){
    const d=addDays(t,n);if(n>0)bal-=(+S.gastoDiario||0);
    (byDay[d]||[]).forEach(e=>{bal+=e.delta});
    pts.push({d,bal,ev:byDay[d]||[]});
  }
  return pts;
}
const gastoMov=m=>m.miParte!=null?m.miParte:m.monto;
function metrics(){
  const t=todayISO(),all=instances(addDays(t,-90),addDays(t,60)),pend=all.filter(i=>!isDone(i));
  const pts=project(60,pend);
  const out=pend.filter(i=>i.tipo==='egreso');
  const overdue=out.filter(i=>i.date<t);
  const nextInc=pend.find(i=>i.tipo==='ingreso'&&i.date>t);
  const horizon=nextInc?nextInc.date:addDays(t,14);
  const direct=i=>!(i.kind==='item'&&isCardMedio(i.ref.medio));
  const flow=S.contarVencidos?out:out.filter(i=>i.date>=t);
  const comp=flow.filter(i=>i.date<=horizon&&direct(i)).reduce((s,i)=>s+i.amount,0)+(+S.gastoDiario||0)*Math.max(0,dnum(horizon)-dnum(t));
  const sumTo=d=>flow.filter(i=>i.date<=d).reduce((s,i)=>s+i.amount,0);
  const deuda=S.cards.reduce((s,c)=>s+(+c.balance||0),0),limite=S.cards.reduce((s,c)=>s+(+c.limite||0),0);
  const itemsEg=S.items.filter(i=>i.tipo==='egreso'),itemsIn=S.items.filter(i=>i.tipo==='ingreso');
  const ingM=S.ingresoProy>0?+S.ingresoProy:itemsIn.reduce((s,i)=>s+perMonth(i),0);
  const egCat={Needs:0,Wants:0,Ahorro:0};itemsEg.forEach(i=>{const c=i.cat||'Needs';egCat[c]=(egCat[c]||0)+perMonth(i)});
  const msiM=S.cards.reduce((s,c)=>s+(c.msi||[]).filter(p=>p.remaining>0).reduce((a,p)=>a+msiMensual(p),0),0);
  const cardsM=S.cards.reduce((s,c)=>s+cardEst(c,0),0);
  const gastoM=egCat.Needs+egCat.Wants+cardsM+(+S.gastoDiario||0)*30;
  const colchon=gastoM>0?S.cash/(gastoM/30):null;
  const mk=monthKey(t),real={Needs:0,Wants:0,Ahorro:0};
  S.movs.filter(m=>m.tipo==='egreso'&&monthKey(m.fecha)===mk&&real[m.cat]!==undefined).forEach(m=>{real[m.cat]+=gastoMov(m)});
  const mStart=mk+'-01',mThis=all.filter(i=>i.tipo==='egreso'&&i.date>=mStart&&i.date<=t);
  const mReal=mThis.filter(i=>!(i.rec&&i.rec.omit));const puntual={ok:mReal.filter(isDone).length,total:mReal.length};
  const minPt=pts.reduce((a,p)=>p.bal<a.bal?p:a,pts[0]);
  const neg=pts.find(p=>p.bal<0);
  const dom=S.items.filter(i=>i.domiciliado&&i.tipo==='egreso');
  return{t,pend,pts,out,overdue,nextInc,horizon,comp,libre:S.cash-comp,sum7:sumTo(addDays(t,7)),deuda,limite,ingM,egCat,msiM,cardsM,gastoM,colchon,real,puntual,minPt,neg,mk,dom};
}

function chart(pts,h){
  h=h||190;const W=640,pl=46,pr=10,pt=12,pb=22;
  const vals=pts.map(p=>p.bal);let mn=Math.min(0,...vals),mx=Math.max(...vals);if(mx<=mn)mx=mn+1;mx+=(mx-mn)*.06;
  const x=i=>pl+(W-pl-pr)*i/Math.max(1,pts.length-1),y=v=>pt+(h-pt-pb)*(1-(v-mn)/(mx-mn));
  const line=pts.map((p,i)=>`${i?'L':'M'}${x(i).toFixed(1)} ${y(p.bal).toFixed(1)}`).join(' ');
  const area=`${line} L${x(pts.length-1).toFixed(1)} ${y(0).toFixed(1)} L${x(0).toFixed(1)} ${y(0).toFixed(1)} Z`;
  let g='';for(let k=0;k<4;k++){const v=mn+(mx-mn)*k/3;g+=`<line class="gl" x1="${pl}" x2="${W-pr}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}"/><text x="${pl-6}" y="${(y(v)+4).toFixed(1)}" text-anchor="end">${fmtK(v)}</text>`}
  const lab=[0,Math.floor((pts.length-1)/2),pts.length-1].map((i,k)=>{const p=parse(pts[i].d);return `<text x="${x(i).toFixed(1)}" y="${h-6}" text-anchor="${k===0?'start':k===2?'end':'middle'}">${p.d} ${MES[p.m]}</text>`}).join('');
  const negs=pts.map((p,i)=>p.bal<0?`<circle class="neg" cx="${x(i).toFixed(1)}" cy="${y(p.bal).toFixed(1)}" r="2.4"/>`:'').join('');
  const mi=vals.indexOf(Math.min(...vals));
  return `<svg class="chart" viewBox="0 0 ${W} ${h}" role="img" aria-label="Saldo proyectado de ${dshort(pts[0].d)} a ${dshort(pts[pts.length-1].d)}. Mínimo ${fmt0(Math.min(...vals))}.">${g}${mn<0?`<line class="zero" x1="${pl}" x2="${W-pr}" y1="${y(0).toFixed(1)}" y2="${y(0).toFixed(1)}"/>`:''}<path class="ar" d="${area}"/><path class="ln" d="${line}"/>${negs}<circle class="mn" cx="${x(mi).toFixed(1)}" cy="${y(vals[mi]).toFixed(1)}" r="4"/>${lab}</svg>`;
}
function tira(pts){
  const t=todayISO(),n=28,P=pts.slice(0,n);
  const mx=Math.max(1,...P.map(p=>Math.max(0,p.bal))),sel=ui.sel&&P.find(p=>p.d===ui.sel)?ui.sel:null;
  const cols=P.map(p=>{
    const h=p.bal<0?14:Math.max(3,Math.round(p.bal/mx*62));
    const dots=p.ev.slice(0,4).map(e=>`<i class="${e.i.tipo==='egreso'?'':'in'}"></i>`).join('');
    return `<button type="button" data-a="tiraDia" data-d="${p.d}" class="${p.bal<0?'neg':''} ${sel===p.d?'sel':''}" aria-label="${dshort(p.d)}, saldo ${fmt0(p.bal)}, ${p.ev.length} movimientos"><span class="dots">${dots}</span><span class="bar" style="height:${h}px"></span></button>`}).join('');
  const labs=P.map(p=>{const d=parse(p.d);return `<span class="${p.d===t?'today':d.d===1?'mon':''}">${p.d===t?'hoy':d.d===1?MES[d.m]:d.d}</span>`}).join('');
  const sp=sel?P.find(p=>p.d===sel):null;
  const det=sp?`<b>${dshort(sp.d)}</b> · saldo <b>${fmt0(sp.bal)}</b><br>${sp.ev.length?sp.ev.map(e=>`<span class="ev">${esc(e.i.name)} ${e.i.tipo==='egreso'?'−':'+'}${fmt0(e.i.amount)}</span>`).join(''):'<span class="ev">Sin movimientos programados.</span>'}`:'Toca un día para ver qué pasa.';
  return `<div class="tira"><div class="tira-cols" role="group" aria-label="Saldo día por día, próximas 4 semanas">${cols}</div><div class="tira-lab">${labs}</div><div class="tira-det" aria-live="polite">${det}</div></div>`;
}

/* ===== grupos (gastos compartidos) ===== */
const meName=()=>S.nombre||'Yo';
const gMembers=g=>[{id:'yo',nombre:meName()},...g.miembros];
const gName=(g,id)=>id==='yo'?meName():((g.miembros.find(m=>m.id===id)||{}).nombre||'Alguien');
function splitEqual(monto,ids){
  const n=ids.length,base=Math.floor(monto*100/n),out={};let rest=Math.round(monto*100)-base*n;
  ids.forEach(id=>{out[id]=(base+(rest>0?1:0))/100;if(rest>0)rest--});return out;
}
function eventsWith(g,mid){
  const t=todayISO(),ev=[];
  g.gastos.forEach((x,i)=>{
    if(x.pagador==='yo'&&(x.partes[mid]||0)>0)ev.push({fecha:x.fecha,ord:i,tipo:'gasto',ref:x,desc:x.desc,det:`Pagaste tú · su parte`,delta:x.partes[mid]});
    else if(x.pagador===mid&&(x.partes.yo||0)>0)ev.push({fecha:x.fecha,ord:i,tipo:'gasto',ref:x,desc:x.desc,det:`Pagó ${gName(g,mid)} · tu parte`,delta:-x.partes.yo});
  });
  g.pagos.forEach((p,i)=>{
    if(p.de===mid&&p.a==='yo')ev.push({fecha:p.fecha,ord:i,tipo:'pago',ref:p,desc:'Te pagó',det:p.nota||'',delta:-p.monto});
    else if(p.de==='yo'&&p.a===mid)ev.push({fecha:p.fecha,ord:i,tipo:'pago',ref:p,desc:'Le pagaste',det:p.nota||'',delta:p.monto});
  });
  (g.cargos||[]).filter(c=>c.miembro===mid).forEach((c,i)=>{
    const from=c.desde||t;
    occ({freq:'mensual',dia:c.dia},from,t).forEach(d=>ev.push({fecha:d,ord:i,tipo:'cargo',ref:c,desc:c.concepto,det:'Cobro programado',delta:c.monto}));
  });
  ev.sort((a,b)=>a.fecha<b.fecha?-1:a.fecha>b.fecha?1:(a.tipo==='cargo'?-1:1)-(b.tipo==='cargo'?-1:1)||a.ord-b.ord);
  let run=0;ev.forEach(e=>{run=Math.round((run+e.delta)*100)/100;e.run=run});
  return ev;
}
const balanceWith=(g,mid)=>{const e=eventsWith(g,mid);return e.length?e[e.length-1].run:0};
function groupTotals(){
  let owed=0,owe=0;
  S.grupos.forEach(g=>g.miembros.forEach(m=>{const b=balanceWith(g,m.id);if(b>0)owed+=b;else owe-=b}));
  return{owed,owe};
}
function compartirPago(i,rec,monto,fecha,gid){
  const g=S.grupos.find(x=>x.id===gid);if(!g)return;
  const ids=gMembers(g).map(m=>m.id),partes=splitEqual(monto,ids);
  g.gastos.unshift({id:uid(),fecha,desc:i.name,monto,pagador:'yo',partes,srcKey:i.key,cashDelta:0,movId:null,vals:null,pmedio:(i.kind==='item'&&i.ref&&i.ref.medio)||rec.cuenta||i.pmedio||''});
  const mov=S.movs.find(m=>m.id===rec.mov);if(mov)mov.miParte=partes.yo;
}
function applyGasto(g,x,v){
  x.cashDelta=0;x.cardId=null;x.cardDelta=0;x.pmedio=x.pagador==='yo'?normMedio(v.medio):'';
  if(x.pagador==='yo'&&v.descontar){
    if(isCardMedio(x.pmedio)){const c=cardOf(x.pmedio);c.balance=r2((+c.balance||0)+x.monto);x.cardId=c.id;x.cardDelta=x.monto}
    else{x.cuentaId=moveCash(-x.monto,x.pmedio);x.cashDelta=-x.monto}
  }
  x.movId=null;
  if(v.miparte&&(x.partes.yo||0)>0){const id=uid();x.movId=id;S.movs.unshift({id,fecha:x.fecha,tipo:'egreso',monto:x.partes.yo,desc:`${x.desc} (${g.nombre})`,cat:v.cat||'Wants',metodo:'cuenta',noCash:true,grupoId:g.id})}
}
function revertGasto(x){
  moveCash(-(x.cashDelta||0),x.cuentaId);
  if(x.cardDelta){const c=cardOf(x.cardId);if(c)c.balance=Math.max(0,r2((+c.balance||0)-x.cardDelta))}
  if(x.movId)S.movs=S.movs.filter(m=>m.id!==x.movId);
}
function editGrupo(id){
  const g=id?S.grupos.find(x=>x.id===id):null;
  const v=g?{nombre:g.nombre,tipo:g.tipo,miembros:g.miembros.map(m=>m.nombre).join(', ')}:{nombre:'',tipo:'depa',miembros:''};
  openForm({title:g?'Editar grupo':'Nuevo grupo',vals:v,del:!!g,
    note:'Un grupo es una cuenta compartida: tu depa, salidas con tus amigas, un viaje. Tú ya estás dentro.',
    fields:()=>[
      {k:'nombre',label:'Nombre del grupo',ph:'Depa, Salidas con amigas…'},
      {k:'tipo',label:'Tipo',type:'select',opts:[['depa','Casa o depa'],['salidas','Salidas'],['viaje','Viaje'],['otro','Otro']]},
      {k:'miembros',label:'Las otras personas',ph:'Mariana, Luis',hint:'Sus nombres, separados por coma.'}],

        g.nombre=v.nombre.trim();g.tipo=v.tipo;g.miembros=keep;
      }else S.grupos.push({id:uid(),nombre:v.nombre.trim(),tipo:v.tipo,miembros:names.map(n=>({id:uid(),nombre:n})),gastos:[],pagos:[],cargos:[]});

  const g=S.grupos.find(x=>x.id===gid),x=xid?g.gastos.find(y=>y.id===xid):null;

  else{v={desc:'',monto:'',fecha:todayISO(),pagador:'yo',reparto:'igual',descontar:true,miparte:true,cat:'Wants',medio:ultMedio()};ms.forEach(m=>{v['p_'+m.id]=true;v['x_'+m.id]=''})}

      }

      commit('Gasto guardado');},
    onDel:()=>{revertGasto(x);g.gastos=g.gastos.filter(y=>y.id!==xid);commit('Gasto eliminado')}});
}

async function jpost(url,body,form){
  const r=await fetch(url,{method:'POST',headers:{'Content-Type':form?'application/x-www-form-urlencoded':'application/json'},body:form?body:JSON.stringify(body)});
  let j=null;try{j=await r.json()}catch(e){}

async function signIn(email,pw,up){
  let r;
  try{r=await jpost('https://identitytoolkit.googleapis.com/v1/accounts:'+(up?'signUp':'signInWithPassword')+'?key='+CFG.apiKey,{email,password:pw,returnSecureToken:true})}
  catch(e){return{err:'No hay conexión. Intenta de nuevo con internet.'}}
  if(!r.ok){const full=String((r.json.error||{}).message||''),code=full.split(' ')[0];return{err:/API key/i.test(full)?'La clave de Firebase de esta app no es válida. Hay que revisar la configuración.':/OPERATION_NOT_ALLOWED/.test(full)?'El inicio de sesión con correo no está activado en Firebase.':AUTH_MSG[code]||(up?'No se pudo crear la cuenta (':'No se pudo iniciar sesión (')+(code||r.status)+').'}}
  AU={email:r.json.email||email,uid:r.json.localId,idToken:r.json.idToken,refreshToken:r.json.refreshToken,exp:Date.now()+(+r.json.expiresIn||3600)*1000};
  saveAU();return{ok:1};
}
function signOut(){AU=null;saveAU();dbDoc=null;dbState='local'}
async function token(){
  if(!AU)throw new Error('sin sesion');
  if(AU.exp-60000>Date.now())return AU.idToken;
  const r=await jpost('https://securetoken.googleapis.com/v1/token?key='+CFG.apiKey,'grant_type=refresh_token&refresh_token='+encodeURIComponent(AU.refreshToken),true);
  if(!r.ok){
    const code=String((r.json.error||{}).message||'');
    if(/TOKEN_EXPIRED|INVALID_REFRESH_TOKEN|USER_NOT_FOUND|USER_DISABLED/.test(code)){signOut();throw new Error('sesion vencida')}
    throw new Error('red');
  }
  AU.idToken=r.json.id_token;AU.refreshToken=r.json.refresh_token||AU.refreshToken;AU.exp=Date.now()+(+r.json.expires_in||3600)*1000;saveAU();
  return AU.idToken;
}

const stable=o=>JSON.stringify(o,(k,v)=>v&&typeof v==='object'&&!Array.isArray(v)?Object.keys(v).sort().reduce((a,x)=>(a[x]=v[x],a),{}):v);
const SHF={g:['id','fecha','desc','monto','pagador','partes'],p:['id','fecha','de','a','monto','nota'],c:['id','miembro','concepto','monto','dia','desde'],m:['id','nombre','monto','fecha'],a:['id','meta','miembro','fecha','monto']};
const COLL={g:'gastos',p:'pagos',c:'cargos',m:'metas',a:'aportes'};
function mapIds(k,x,f){
  const o={};SHF[k].forEach(n=>o[n]=x[n]);
  if(k==='g'){o.pagador=f(x.pagador);o.partes={};Object.keys(x.partes||{}).forEach(i=>o.partes[f(i)]=x.partes[i])}
  if(k==='p'){o.de=f(x.de);o.a=f(x.a)}
  if(k==='c')o.miembro=f(x.miembro);
  if(k==='a')o.miembro=f(x.miembro);
  return o;
}
const toSh=(c,k,x)=>mapIds(k,x,id=>id==='yo'?c.me:id);
const fromSh=(c,k,o)=>mapIds(k,o,id=>id===c.me?'yo':id);

/* Une lo local con lo remoto, elemento por elemento. Devuelve true si cambió algo local. */
async function syncGroup(g){
  const c=g.cloud;if(!c)return false;
  let touched=false;
  for(let tries=0;tries<3;tries++){
    const r=await getGroup(c.id);
    if(!r){c.lost=true;return touched}
    c.lost=false;
    let R={};try{R=JSON.parse(r.json||'{}')}catch(e){}
    R.g=R.g||{};R.p=R.p||{};R.c=R.c||{};R.m=R.m||{};R.a=R.a||{};R.names=R.names||{};
    const before=stable(R),now=Date.now(),pending=[];
    c.last=c.last||{g:{},p:{},c:{}};
    for(const k of ['g','p','c','m','a']){
      const arr=g[COLL[k]]=g[COLL[k]]||[];
      const last=c.last[k]=c.last[k]||{},ids=new Set(arr.map(x=>x.id)),changed=new Set();
      arr.forEach(x=>{const o=toSh(c,k,x),h=stable(o);if(last[x.id]!==h){changed.add(x.id);R[k][x.id]={...o,mod:now};pending.push(()=>{last[x.id]=h})}});
      Object.keys(last).forEach(id=>{if(!ids.has(id)){changed.add(id);R[k][id]={id,del:1,mod:now};pending.push(()=>{delete last[id]})}});
      Object.keys(R[k]).forEach(id=>{
        if(changed.has(id))return;
        const ro=R[k][id],i=arr.findIndex(x=>x.id===id);
        if(ro.del){if(i>=0){if(k==='g')revertGasto(arr[i]);if(k==='p')revertPago(arr[i]);if(k==='a')revertAporte(arr[i]);arr.splice(i,1);touched=true}delete last[id];return}
        const loc=fromSh(c,k,ro);
        if(i<0){arr.push(k==='g'?{...loc,cashDelta:0,movId:null,vals:null}:k==='p'?{...loc,cashDelta:0,movId:null}:loc);touched=true}
        else if(stable(toSh(c,k,arr[i]))!==stable(mapIds(k,ro,x=>x))){Object.assign(arr[i],loc);if(k==='g')arr[i].vals=null;touched=true}
        last[id]=stable(toSh(c,k,arr.find(x=>x.id===id)));
      });
    }
    /* personas y datos del grupo */
    R.names[c.me]=S.nombre||R.names[c.me]||'Yo';
    g.miembros.forEach(m=>{if(!R.names[m.id])R.names[m.id]=m.nombre});
    if(c.owner){R.n=g.nombre;R.t=g.tipo;R.owner=c.me}
    else{if(R.n&&R.n!==g.nombre){g.nombre=R.n;touched=true}if(R.t&&R.t!==g.tipo){g.tipo=R.t;touched=true}}
    Object.keys(R.names).forEach(sid=>{
      if(sid===c.me)return;
      const m=g.miembros.find(x=>x.id===sid);
      if(!m){g.miembros.push({id:sid,nombre:R.names[sid]});touched=true}
      else if(m.nombre!==R.names[sid]&&sid.length>20){m.nombre=R.names[sid];touched=true}
    });
    if(stable(R)===before){pending.forEach(f=>f());return touched}
    const q='currentDocument.updateTime='+encodeURIComponent(r.updateTime);
    const w=await fs('PATCH','/groups/'+c.id,gFields(r.members,R),q);
    if(w.ok){pending.forEach(f=>f());return touched}
    if(w.status!==409&&w.status!==412&&w.status!==400)throw new Error('fs '+w.status);
  }
  throw new Error('conflicto');
}
let syncing=false;
async function syncAll(){
  if(!cloudOn()||!S||syncing)return;
  const gs=S.grupos.filter(g=>g.cloud);if(!gs.length)return;
  syncing=true;let touched=false,err=false;const b0=stable(gs.map(g=>g.cloud));
  for(const g of gs){try{if(await syncGroup(g))touched=true}catch(e){err=true}}
  syncing=false;

async function cloudPull(){
  if(!cloudOn())return;
  dbDoc=userDoc;
  try{
    const own=getOwner();
    if(own&&own!==AU.uid){S=null;ST=null;try{localStorage.removeItem(KEY)}catch(e){}}
    const snap=await dbDoc.get();
    const d=snap.exists?(snap.data()||{}):{};
    if(d.json){
      const raw=JSON.parse(d.json);
      if((raw.v||0)>APPV){window.OLDAPP=true;toast('Hay una versión más nueva de la app. Ciérrala y ábrela de nuevo para actualizar.');return}
      const r=migrate(raw);
      let usar=null;
      if(!trivial(S)&&!trivial(r)&&!own){window.HOLD=true;if(!M)render();usar=await askConflict();window.HOLD=false}
      let take;
      if(usar==='aqui')take=false;else if(usar==='cuenta')take=true;else if(trivial(S))take=true;else if(trivial(r))take=false;else take=(r.updated||0)>(S.updated||0);
      if(take){S=r;try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}else persist(true);
    }else if(S)persist(true);
    setOwner(AU.uid);
    dbState='cloud';
  }catch(e){window.HOLD=false;dbState=AU?(navigator.onLine?'error':'offline'):'local'}
  if(S)accrueAll();
  await syncAll();
  if(!M)render();
}

function moveCash(delta,cid){
  let a=acc(cid)||defAcc();
  if(!delta)return a?a.id:undefined;
  if(!a){a={id:uid(),nombre:'Débito',banco:'',tipo:'debito',saldo:0,tasa:0,color:'teal'};accs().push(a)}
  a.saldo=r2((+a.saldo||0)+delta);recalcCash();return a.id;
}
const PAGOS_REND=[['','No lo calculo, yo actualizo el saldo'],['diario','Todos los días, se suma al saldo (ej. Nu)'],['mensual','Se acredita el día 1 del mes siguiente (ej. Finsus)']];
function accrueAcc(a,today){
  if(!a||a.tipo!=='ahorro'||!a.pago||!(+a.tasa>0)){return false}
  if(!a.rendTo){a.rendTo=today;return true}
  let d=a.rendTo,n=0;
  while(d<today&&n<400){
    d=addDays(d,1);n++;
    const i=(+a.saldo||0)*a.tasa/36500;
    if(a.pago==='diario')a.saldo=r2((+a.saldo||0)+i);else a.pend=(a.pend||0)+i;
    if(a.pago==='mensual'&&d.slice(8)==='01'&&a.pend>0){a.saldo=r2((+a.saldo||0)+a.pend);a.ultAcred={fecha:d,monto:r2(a.pend)};a.pend=0}
  }
  if(n>=400)d=today;
  a.rendTo=d;return n>0;
}

  const t=todayISO();let ch=false;
  accs().forEach(a=>{if(accrueAcc(a,t))ch=true});

}

function projectAcc(days,pend){
  const t=todayISO(),d0=defAcc(),bal={},ev={},neg={};
  if(!d0)return neg;
  accs().filter(isLiquid).forEach(a=>bal[a.id]=+a.saldo||0);
  pend.forEach(i=>{
    if(i.kind==='item'&&isCardMedio(i.ref.medio))return;
    if(i.date<t&&!S.contarVencidos)return;
    const d=i.date<t?t:i.date;if(d>addDays(t,days))return;
    const id=i.tipo==='ingreso'?accIdOf(i.ref.destino):i.kind==='item'?accIdOf(i.ref.medio):accIdOf(i.ref.cuenta);
    (ev[d]=ev[d]||[]).push([id,(i.tipo==='egreso'?-1:1)*i.amount]);
  });
  for(let n=0;n<=days;n++){
    const d=addDays(t,n);
    if(n>0&&bal[d0.id]!==undefined)bal[d0.id]-=(+S.gastoDiario||0);
    (ev[d]||[]).forEach(([id,x])=>{if(bal[id]!==undefined)bal[id]+=x});
    for(const id in bal)if(bal[id]<-0.005&&!neg[id])neg[id]={d,bal:bal[id]};
  }

}

  }

  if(A.act.tarjeta)S.cards.forEach(c=>{const u=c.limite>0?c.balance/c.limite*100:0;if(u>(+A.uso||70))out.push({k:'tarjeta',tone:u>=90?'bad':'warn',text:`${c.nombre} está al ${Math.round(u)}% de su límite (tu tope es ${A.uso}%).`,go:'tarjetas'})});

  return out;

function parseStatement(lines){

  if(per&&monthIdx(per[5])>=0&&monthIdx(per[2])>=0){endY=+per[6];endM=monthIdx(per[5]);startISO=isoOf(+per[3],monthIdx(per[2]),+per[1]);meta.periodo=[startISO,isoOf(endY,endM,+per[4])]}
  if(endY==null){const ys={};(full.match(/\b20[1-3]\d\b/g)||[]).forEach(y=>ys[y]=(ys[y]||0)+1);const top=Object.entries(ys).sort((a,b)=>b[1]-a[1])[0];endY=top?+top[0]:new Date().getFullYear()}

async function readPdfLines(file,password){

    chars+=its.reduce((s,i)=>s+i.s.length,0);
    its.sort((a,b)=>b.y-a.y||a.x-b.x);

    for(const it of its){const g=groups.find(g=>Math.abs(g.y-it.y)<=3);if(g)g.items.push(it);else groups.push({y:it.y,items:[it]})}

    if(!why.length)continue;

    const ex=viaRef||S.items.find(it=>it.tipo==='egreso'&&(normKey(it.nombre)===k||(normKey(it.nombre)&&k.includes(normKey(it.nombre)))||(Math.abs(it.monto-last.monto)<=it.monto*.03&&Math.abs((it.dia||parse(it.fecha).d)-parse(last.fecha).d)<=3)));

async function stHandleFile(file){

    ${st('de tu ingreso mensual debes en tarjetas',m.ingM>0?(m.deuda/m.ingM).toFixed(1)+' meses':'—',m.ingM>0?tone(m.deuda/m.ingM,1.5,3):'')}
    ${st('de gastos cubiertos con tu saldo',col!=null?Math.floor(col)+' días':'—',col!=null?(col>=30?'good':col>=14?'warn':'bad'):'')}
    ${st('pagos del mes al corriente',m.puntual.total?`${m.puntual.ok} de ${m.puntual.total}`:'—',m.puntual.total&&m.puntual.ok<m.puntual.total?'warn':'')}
    ${st('al mes en compras a meses',fmt0(msiM),m.ingM>0?tone(msiM/m.ingM,.1,.2):'')}
    ${st('de gastos en tu fondo de emergencia',m.gastoM>0&&S.emergencia>0?(S.emergencia/m.gastoM).toFixed(1)+' meses':'—',m.gastoM>0&&S.emergencia>0?(S.emergencia/m.gastoM>=3?'good':'warn'):'')}
  </div></section>
  ${S.cards.length?`<section class="sect"><h2>Compras a meses<small>12 meses</small></h2><div class="cols">${cols.map(c=>`<div><em>${c.v>0?fmtK(c.v).replace('$',''):''}</em><i style="height:${(c.v/mxc*88).toFixed(0)}%"></i><small>${c.lab}</small></div>`).join('')}</div></section>
  <section class="sect"><h2>A cuál tarjeta abonar primero</h2>${orden.length?orden.map((c,i)=>`<div class="kv"><span>${i+1}. ${esc(c.nombre)}</span><span class="n">${c.tasa?c.tasa+'%':'sin tasa'} · ${fmt0(c.balance)}</span></div>`).join('')+'<div class="small muted" style="margin-top:8px">La tasa más alta primero. Captura la tasa de cada tarjeta para que el orden sea real.</div>':'<div class="empty">Sin saldos pendientes.</div>'}</section>`:''}`;
}

/* ===== vistas: movimientos, estados, grupos, ajustes ===== */
function vMov(){
  const sub=ui.sub.mov||'lista';
  const head=`<header class="top"><h1>Movimientos</h1>${plusBtn('Registrar un gasto')}</header><div>${segHTML('mov',[['lista','Mis movimientos'],['estado','Estado de cuenta']],'lista')}</div>`;
  if(sub==='estado')return head+vEstado();
  const rows=S.movs.slice().sort((a,b)=>a.fecha<b.fecha?1:a.fecha>b.fecha?-1:0).slice(0,60);
  return head+(rows.length?`<section>${rows.map(x=>{
    const inB=['Needs','Wants','Ahorro'].includes(x.cat);
    const via=x.tipo==='transfer'?'':x.metodo!=='cuenta'?(cardOf(x.metodo)||{nombre:'Tarjeta'}).nombre:(accs().length>1&&acc(x.cuenta)?acc(x.cuenta).nombre:'');
    return `<div class="row nochk">${rdate(x.fecha)}<div class="rmain"><div class="rname">${esc(x.desc)}</div><div class="rsub">${x.tipo==='egreso'&&x.cat!=='Deuda'&&x.cat!=='Reembolso'?`<span class="tag">${esc(comercioOf(x).rubro)}</span>`:`<span class="tag">${esc(x.cat)}</span>`}${via?`<span class="tag">${esc(via)}</span>`:''}${x.paypal?'<span class="tag">PayPal</span>':''}${x.fuente==='estado'?'<span class="tag ok">Del estado de cuenta</span>':''}${x.miParte!=null?`Tu parte: ${fmt(x.miParte)}`:''}</div></div><div class="ramt ${x.tipo==='ingreso'?'in':''}">${x.tipo==='transfer'?'⇄ ':x.tipo==='ingreso'?'+':'−'}${fmt(x.monto)}</div>${(x.manual||x.fuente==='estado')?`<div class="ract"><button class="link" data-a="delMov" data-id="${x.id}">Quitar</button></div>`:''}</div>`}).join('')}</section>`:'<div class="empty"><b>Aún no hay movimientos</b>Registra un gasto, paga algo desde Pagos o sube un estado de cuenta.</div>');
}
function vEstado(){
  if(!ST)ST=newST();
  const cuentas=[...accs().filter(isLiquid).map(a=>['acc:'+a.id,a.nombre]),...S.cards.map(c=>[c.id,'Tarjeta '+c.nombre])];
  if(ST.cuenta==='cuenta'&&defAcc())ST.cuenta='acc:'+defAcc().id;
  if(ST.stage==='revisar')return vRevision();
  const aviso=`<div class="alert info" style="margin-bottom:14px">Tu archivo se lee aquí, en tu dispositivo. No se envía a ningún lado. Solo se guardan los movimientos que confirmes, y los números largos de cuenta o tarjeta se tapan antes de mostrarse.</div>`;
  return `${aviso}<div class="tools"><section>
    <div class="fld" style="margin-bottom:14px"><label for="st_cuenta">¿De qué cuenta es el estado?</label><select id="st_cuenta" data-st="cuenta">${cuentas.map(([k,l])=>`<option value="${esc(k)}" ${ST.cuenta===k?'selected':''}>${esc(l)}</option>`).join('')}</select></div>
    <label class="drop" id="drop" style="display:block;cursor:pointer"><b style="display:block;color:var(--ink);font:700 17px var(--f-display)">${ST.busy?'Leyendo…':'Elige el PDF o el CSV'}</b><span>o arrástralo aquí</span><input id="stfile" type="file" accept=".pdf,.csv,.txt,application/pdf,text/csv" hidden></label>
    ${ST.needPw?`<div class="fld" style="margin-top:12px"><label for="st_pw">Contraseña del PDF</label><input id="st_pw" type="password" data-st="pw" value="${esc(ST.pw)}" autocomplete="off"></div><button class="btn sm" style="margin-top:8px" data-a="stRetry">Abrir con contraseña</button>`:''}
    ${ST.msg?`<div class="alert ${ST.msgTone==='bad'?'bad':ST.msgTone==='warn'?'warn':'info'}" style="margin-top:12px">${esc(ST.msg)}</div>`:''}
    ${ST.scanned&&ST.doc&&window.claude?`<div class="box" style="margin-top:12px"><h2 style="font-size:16px">¿Es un PDF escaneado?</h2><p class="small muted" style="margin:0 0 10px">Puedo pedirle a Claude que lo lea. Para eso las primeras páginas se envían como imagen a Claude. Si prefieres que no salgan de tu dispositivo, usa un CSV o pega el texto.</p><label class="chk-l" style="margin-bottom:10px"><input type="checkbox" data-st="consent" ${ST.consent?'checked':''}> Entiendo que las páginas se envían a Claude</label><button class="btn sm" data-a="stClaude" ${ST.consent&&!ST.busy?'':'disabled'}>Leer con Claude</button></div>`:''}
  </section>
  <section><div class="fld"><label for="st_paste">O pega el texto de los movimientos</label><textarea id="st_paste" data-st="pasteText" placeholder="05 OCT   SUPERMERCADO   640.00&#10;06 OCT   NETFLIX   219.00">${esc(ST.pasteText)}</textarea><small>Cada renglón empieza con la fecha y termina con el monto.</small></div><button class="btn ghost sm" style="margin-top:8px" data-a="stPaste">Leer texto</button></section></div>`;
}
function vRevision(){
  const rows=ST.rows,n=k=>rows.filter(r=>r.flag===k).length;
  const isCard=isCardMedio(ST.cuenta),card=isCard?cardOf(ST.cuenta):null,mt=ST.meta||{};
  const flagPill=r=>({nuevo:'<span class="pill info">Nuevo</span>',registrado:'<span class="pill warn">Ya lo tienes</span>',visto:'<span class="pill info">Ya importado</span>',pagoTarjeta:'<span class="pill info">Pago a la tarjeta</span>',programado:`<span class="pill good">Pago programado${ST.pend[r.ref]?': '+esc(ST.pend[r.ref].name):''}</span>`}[r.flag]||'')+(r.domi?' <span class="pill info">Posible domiciliación</span>':'');
  const catOptsRow=r=>(r.tipo==='abono'?[['Ingreso','Ingreso'],['Ignorar','No guardar']]:[['Needs','Necesidad'],['Wants','Gusto'],['Ahorro','Ahorro'],['Deuda','Pago de deuda'],['Ignorar','No guardar']]).map(([k,l])=>`<option value="${k}" ${r.cat===k?'selected':''}>${l}</option>`).join('');
  const inc=rows.filter(r=>r.inc&&r.cat!=='Ignorar').length;
  return `<div class="alert info" style="margin-bottom:14px">Revisa antes de guardar. Nada se guarda hasta que confirmes. ${esc(ST.file||'')}</div>
  <div class="chips" style="margin-bottom:14px"><span class="pill good">${n('nuevo')} nuevos</span><span class="pill good">${n('programado')} coinciden con pagos programados</span><span class="pill warn">${n('registrado')+n('visto')} ya estaban</span>${n('pagoTarjeta')?`<span class="pill info">${n('pagoTarjeta')} pagos a la tarjeta</span>`:''}</div>
  ${card&&(mt.pagoSinIntereses!=null||mt.saldoTotal!=null)?`<div class="box" style="margin-bottom:14px"><h2 style="font-size:16px">Datos de la tarjeta que encontré</h2>${mt.pagoSinIntereses!=null?`<div class="kv"><span>Pago para no generar intereses</span><span class="n">${fmt(mt.pagoSinIntereses)}</span></div>`:''}${mt.saldoTotal!=null?`<div class="kv"><span>Saldo total</span><span class="n">${fmt(mt.saldoTotal)}</span></div>`:''}${mt.fechaCorte?`<div class="kv"><span>Fecha de corte</span><span>${dnice(mt.fechaCorte)}</span></div>`:''}${mt.fechaLimite?`<div class="kv"><span>Fecha límite de pago</span><span>${dnice(mt.fechaLimite)}</span></div>`:''}<div class="small muted" style="margin:8px 0">Compáralos con tu estado antes de aplicarlos.</div><button class="btn sm" data-a="aplicarMeta">Aplicar a ${esc(card.nombre)}</button></div>`:''}
  ${ST.missing.length?`<div class="alert warn" style="margin-bottom:14px"><b>Domiciliados que no vi en este estado:</b> ${ST.missing.map(m=>`${esc(m.item.nombre)} (esperado el ${dshort(m.date)})`).join(', ')}. Puede que se cobren en otra cuenta o que ya no estén activos.</div>`:''}
  ${ST.domis.length?`<section style="margin-bottom:14px"><h2>Posibles domiciliaciones<small>cobros que parecen automáticos</small></h2>${ST.domis.map((d,i)=>`<div class="row nochk"><div class="rmain" style="grid-column:1 / 3"><div class="rname">${esc(d.nombre)}</div><div class="rsub">${d.why.map(esc).join('. ')}.${d.existing?` Ya lo tienes como "${esc(d.exNombre)}"${d.exDom?' y está marcado como domiciliado':''}.`:''}</div></div><div class="ramt">${fmt(d.monto)}</div><div class="ract">${d.existing?(d.exDom?'<span class="pill good">Ya registrado</span>':`<button class="btn ghost sm" data-a="domiMarcar" data-i="${i}">Marcar como domiciliado</button>`):`<button class="btn sm" data-a="domiAgregar" data-i="${i}">Agregar a Pagos</button>`}</div></div>`).join('')}</section>`:''}
  <section><h2>Movimientos del estado<small>${rows.length} encontrados</small></h2><div class="tbl"><table><thead><tr><th>Guardar</th><th>Fecha</th><th>Descripción</th><th class="r">Monto</th><th>Categoría</th><th>Estado</th></tr></thead><tbody>${rows.map(r=>`<tr><td><input type="checkbox" data-r="${r.id}" data-rf="inc" ${r.inc?'checked':''} aria-label="Guardar ${esc(r.desc)}"></td><td>${dshort(r.fecha)}</td><td><input type="text" data-r="${r.id}" data-rf="desc" value="${esc(r.desc)}" aria-label="Descripción"></td><td class="r n" style="color:${r.tipo==='abono'?'var(--good)':'inherit'}">${r.tipo==='abono'?'+':'−'}${fmt(r.monto)}</td><td><select data-r="${r.id}" data-rf="cat" aria-label="Categoría">${catOptsRow(r)}</select></td><td>${flagPill(r)}</td></tr>`).join('')}</tbody></table></div></section>
  <div class="box" style="margin-top:16px"><label class="chk-l"><input type="checkbox" data-st="actualizarSaldo" ${ST.actualizarSaldo?'checked':''}> Actualizar ${isCard?'el saldo de la tarjeta':'mi saldo disponible'} con estos movimientos</label><div class="small muted" style="margin:6px 0 12px">Déjalo apagado si ya cuadraste tu saldo con el banco. Prende solo si los movimientos son posteriores a la última vez que lo actualizaste.</div><div class="chips"><button class="btn" data-a="stConfirm">Guardar ${inc} movimientos</button><button class="btn ghost" data-a="stCancel">Cancelar</button></div></div>`;
}

function vGrupos(){
  if(ui.grupo){const g=S.grupos.find(x=>x.id===ui.grupo);if(g)return vGrupo(g);ui.grupo=null}
  const gt=groupTotals();
  return `<header class="top"><div><h1>Grupos</h1><p>Lo que compartes, sin perder la cuenta.</p></div>${plusBtn('Nuevo grupo')}</header>
  ${cloudOn()?'<div><button class="link" data-a="joinGrupo">Unirme con un código</button></div>':''}
  ${S.grupos.length?`<div class="stats"><div class="stat good"><b>${fmt0(gt.owed)}</b><span>te deben</span></div><div class="stat ${gt.owe>0?'bad':''}"><b>${fmt0(gt.owe)}</b><span>debes</span></div></div>`:''}
  <div class="grid g2">${S.grupos.map(g=>`<section class="box"><h2>${esc(g.nombre)}<small>${({depa:'Casa o depa',salidas:'Salidas',viaje:'Viaje',otro:'Grupo'})[g.tipo]||'Grupo'}</small></h2>${g.miembros.map(m=>{const b=balanceWith(g,m.id);return `<div class="balrow"><span class="who">${esc(m.nombre)}</span><span class="st ${b>0.005?'pos':b<-0.005?'neg':''}">${Math.abs(b)<0.005?'A mano':(b>0?'Te debe ':'Le debes ')+fmt(Math.abs(b))}</span></div>`}).join('')}<div style="margin-top:12px"><button class="link" data-a="abrirGrupo" data-id="${g.id}">Abrir</button></div></section>`).join('')||`<div class="empty" style="grid-column:1/-1"><b>Todavía no tienes grupos</b>Crea uno para tu depa, para las salidas con tus amigas o para un viaje. Cada gasto queda con fecha, quién pagó y cómo se dividió, y puedes ver quién le debe a quién en cualquier momento.</div>`}</div>`;
}
function vGrupo(g){
  const ms=g.miembros,ver=ui.verMiembro;
  const head=`<div><button class="back" data-a="grupoBack">‹ Grupos</button><header class="top"><div><h1>${esc(g.nombre)}</h1><p>${ms.map(m=>esc(m.nombre)).join(', ')} y tú · <button class="link" data-a="editGrupo" data-id="${g.id}">Editar</button></p></div>${plusBtn('Gasto compartido')}</header>${cloudOn()?(g.cloud?`<p class="small muted" style="margin:0 0 4px">Compartido · código <b class="nums">${showCode(g.cloud.id)}</b> <button class="link" data-a="copyCode" data-c="${g.cloud.id}">Copiar</button> · <button class="link" data-a="invitar" data-id="${g.id}">Invitar</button> · <button class="link" data-a="syncGrupo" data-id="${g.id}">Actualizar</button>${g.cloud.lost?' · <span style="color:var(--bad)">el grupo ya no existe en la nube</span>':''}</p>`:`<p class="small muted" style="margin:0 0 4px"><button class="link" data-a="shareGrupo" data-id="${g.id}">Compartir con otra persona</button></p>`):''}</div>`;
  const cuentas=ms.map(m=>{
    const b=balanceWith(g,m.id),ev=eventsWith(g,m.id),open=ver===m.id;
    return `<div class="balrow"><div><span class="who">${esc(m.nombre)}</span> <span class="small muted">${ev.length===1?'1 movimiento':ev.length+' movimientos'}</span></div><span class="st ${b>0.005?'pos':b<-0.005?'neg':''}">${Math.abs(b)<0.005?'A mano':(b>0?'Te debe ':'Le debes ')+fmt(Math.abs(b))}</span>
      <div class="ac">${Math.abs(b)>=0.005?`<button class="btn sm" data-a="saldar" data-g="${g.id}" data-m="${m.id}">${b>0?'Registrar que me pagó':'Registrar que le pagué'}</button>`:''}<button class="btn ghost sm" data-a="verMiembro" data-m="${m.id}">${open?'Ocultar historial':'Ver historial'}</button></div>
      ${open?`<div style="grid-column:1 / -1;margin-top:6px">${ev.length?ev.slice().reverse().map(e=>`<div class="led"><span class="d">${dshort(e.fecha)}</span><span>${esc(e.desc)}<br><span class="d">${esc(e.det)}</span></span><span class="amt" style="color:${e.tipo==='pago'?'var(--good)':e.delta>0?'var(--ink)':'var(--bad)'}">${e.delta>0?'+':'−'}${fmt(Math.abs(e.delta))}</span><span class="run">Saldo ${Math.abs(e.run)<0.005?'a mano':fmt(e.run)}</span></div>`).join(''):'<div class="empty">Aún no hay movimientos con esta persona.</div>'}</div>`:''}</div>`}).join('');
  const lista=[...g.gastos.map(x=>({f:x.fecha,k:'g',x})),...g.pagos.map(p=>({f:p.fecha,k:'p',x:p}))].sort((a,b)=>a.f<b.f?1:a.f>b.f?-1:0);
  return head+`<div class="tools"><section class="box"><h2>Cuentas claras<small>contigo</small></h2>${cuentas}</section>
  <section class="box"><h2>Cobros programados<button class="link" data-a="addCargo" data-g="${g.id}">Agregar</button></h2>${(g.cargos||[]).length?g.cargos.map(c=>`<div class="kv"><span>${esc(gName(g,c.miembro))}: ${esc(c.concepto)}, día ${c.dia}</span><span><span class="n">${fmt(c.monto)}</span> <button class="btn ghost sm" data-a="editCargo" data-g="${g.id}" data-id="${c.id}">Editar</button></span></div>`).join(''):'<div class="small muted">Para rentas de cuarto u otros cobros que se repiten cada mes.</div>'}<div style="margin-top:12px"><button class="btn ghost sm" data-a="addPago" data-g="${g.id}">Registrar pago entre personas</button></div></section></div>
  ${gMetasHTML(g)}
  <section class="sect"><h2>Gastos y pagos del grupo</h2>${lista.length?lista.map(({k,x})=>k==='g'?`<div class="row nochk">${rdate(x.fecha)}<button class="rmain" data-a="editGasto" data-g="${g.id}" data-id="${x.id}"><div class="rname">${esc(x.desc)}</div><div class="rsub">${x.pagador==='yo'?'Pagaste tú'+(x.pmedio&&medioName(x.pmedio)?' con '+esc(medioName(x.pmedio)):''):'Pagó '+esc(gName(g,x.pagador))} · ${Object.keys(x.partes).map(id=>`${esc(id==='yo'?'tú':gName(g,id))} ${fmt0(x.partes[id])}`).join(', ')}</div></button><div class="ramt">${fmt(x.monto)}</div></div>`:`<div class="row nochk">${rdate(x.fecha)}<div class="rmain"><div class="rname">${x.de==='yo'?`Le pagaste a ${esc(gName(g,x.a))}`:x.a==='yo'?`${esc(gName(g,x.de))} te pagó`:`${esc(gName(g,x.de))} le pagó a ${esc(gName(g,x.a))}`}</div><div class="rsub"><span class="tag ok">Pago</span>${esc(x.nota||'')}</div></div><div class="ramt in">${fmt(x.monto)}</div><div class="ract"><button class="link" data-a="delPago" data-g="${g.id}" data-id="${x.id}">Quitar</button></div></div>`).join(''):'<div class="empty"><b>Sin gastos todavía</b>Toca + para registrar el primero.</div>'}</section>`;
}

function vAjustes(){
  const sp=S.split,suma=(+sp.Needs||0)+(+sp.Wants||0)+(+sp.Ahorro||0);
  const inp=(l,k,h,type)=>`<div class="fld"><label for="s_${k}">${l}</label><input id="s_${k}" data-s="${k}" type="${type||'number'}" ${type==='text'?'':'inputmode="decimal" step="any"'} value="${esc(S[k]||'')}">${h?`<small>${h}</small>`:''}</div>`;
  return `<div class="top"><div><h1>Ajustes</h1><p>Tu información es privada. Solo tú la ves.</p></div></div>

  <section class="sect"><h2>Pagos que no marcaste</h2><label class="chk-l"><input type="checkbox" data-cv="1" ${S.contarVencidos?'checked':''}> Seguir restándolos de mi saldo proyectado</label><div class="small muted" style="margin-top:6px">Apagado: si un pago pasó de fecha y no lo marcaste, no se descuenta de tus flujos; solo te sale como vencido. Así un pago que no se hizo no se te arrastra al día siguiente.</div></section>
  ${CFG?`<section class="sect"><h2>Cuenta<small>${AU?esc(AU.email):'sin iniciar sesión'}</small></h2><div class="small muted" style="margin-bottom:10px">${AU?'Tus datos se guardan en tu cuenta y se sincronizan entre tus dispositivos. Los grupos compartidos se actualizan con la otra persona. Al cerrar sesión, este dispositivo se limpia: tus datos siguen en tu cuenta.':'Inicia sesión para guardar tus datos en la nube, usarlos en otro teléfono y compartir grupos.'}</div><div class="chips">${AU?'<button class="btn ghost sm" data-a="syncNow">Sincronizar ahora</button><button class="btn ghost sm" data-a="logout">Cerrar sesión</button>':'<button class="btn sm" data-a="login">Iniciar sesión</button>'}</div></section>
  <section class="sect"><h2>Privacidad</h2><div class="small muted" style="margin-bottom:10px">Qué guardamos, quién lo ve y cómo borrarlo.</div><div class="chips"><button class="btn ghost sm" data-a="privacidad">Aviso de privacidad</button>${AU?'<button class="btn bad-t sm" data-a="borrarCuenta">Borrar mi cuenta y mis datos</button>':''}</div></section>`:''}

function simVals(){
  const sim=S.sim=S.sim||{},ah=accs().filter(a=>a.tipo==='ahorro');

  const pick=(k,d)=>sim[k]!==undefined&&sim[k]!==''?+sim[k]:d;
  return{sel,ah,p:{saldo:pick('saldo',sel?+sel.saldo||0:0),aporte:pick('aporte',0),retiro:pick('retiro',0),tasa:pick('tasa',sel?+sel.tasa||0:0),meses:Math.max(1,Math.round(pick('meses',12)))},sim};
}
function solveDeposit(p,meta,retiro){
  const f=a=>simSave({...p,aporte:a,retiro}).fin;
  if(f(0)>=meta)return 0;
  let lo=0,hi=Math.max(1,meta+retiro*p.meses);
  for(let k=0;k<60;k++){const mid=(lo+hi)/2;if(f(mid)>=meta)hi=mid;else lo=mid}
  return hi;
}
function chartSeries(series,labels,h){
  h=h||190;const W=640,pl=46,pr=10,pt=12,pb=22,n=series[0].pts.length;
  const all=series.flatMap(s=>s.pts);let mn=Math.min(0,...all),mx=Math.max(...all);if(mx<=mn)mx=mn+1;mx+=(mx-mn)*.06;
  const x=i=>pl+(W-pl-pr)*i/Math.max(1,n-1),y=v=>pt+(h-pt-pb)*(1-(v-mn)/(mx-mn));
  let g='';for(let k=0;k<4;k++){const v=mn+(mx-mn)*k/3;g+=`<line class="gl" x1="${pl}" x2="${W-pr}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}"/><text x="${pl-6}" y="${(y(v)+4).toFixed(1)}" text-anchor="end">${fmtK(v)}</text>`}
  const lines=series.map(s=>`<path class="${s.cls}" d="${s.pts.map((v,i)=>`${i?'L':'M'}${x(i).toFixed(1)} ${y(v).toFixed(1)}`).join(' ')}"/>`).join('');
  const lab=[0,Math.floor((n-1)/2),n-1].map((i,k)=>`<text x="${x(i).toFixed(1)}" y="${h-6}" text-anchor="${k===0?'start':k===2?'end':'middle'}">${labels[i]}</text>`).join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${h}" role="img" aria-label="Proyección de tu ahorro">${g}${lines}${lab}</svg>`;
}

/* ===== metas: personales y de grupo ===== */
const metasP=()=>S.metas=S.metas||[];
const metaAcc=m=>m.cuentaId?acc(m.cuentaId):null;
function metaAhorrado(m){const a=metaAcc(m);return a?Math.max(0,r2((+a.saldo||0)-(+m.base||0))):r2(+m.aportado||0)}
const metaTasa=m=>{const a=metaAcc(m);return a&&a.tipo==='ahorro'?(+a.tasa||0):0};
const mesesHasta=f=>Math.max(1,Math.ceil(Math.max(1,dnum(f)-dnum(todayISO()))/30.4-0.15));
const mesesDe=x=>x.meses?Math.max(1,Math.round(+x.meses)):mesesHasta(x.fecha);
function depNecesario(x){const falta=Math.max(0,(+x.monto||0)-(+x.ahorrado||0));return falta<=0?0:r2(needDeposit({saldo:+x.ahorrado||0,meta:+x.monto,tasa:+x.tasa||0,meses:mesesDe(x)}))}
const metaDone=m=>metaAhorrado(m)>=(+m.monto||0);
function gMetaAportado(g,mid){return (g.aportes||[]).filter(a=>a.meta===mid).reduce((s,a)=>s+(+a.monto||0),0)}
function gMetaDep(g,x){return depNecesario({monto:x.monto,ahorrado:gMetaAportado(g,x.id),fecha:x.fecha,tasa:0})}
const gMetaCuota=(g,x)=>r2(gMetaDep(g,x)/((g.miembros||[]).length+1));
function capacidad(exclM,exclG){
  const m=metrics(),ing=+m.ingM||0,gasto=+m.gastoM||0;
  let otras=metasP().filter(x=>x.id!==exclM&&x.fecha&&!metaDone(x)).reduce((s,x)=>s+depNecesario({monto:+x.monto,ahorrado:metaAhorrado(x),fecha:x.fecha,tasa:metaTasa(x)}),0);
  S.grupos.forEach(g=>(g.metas||[]).forEach(x=>{if(x.id!==exclG&&x.fecha&&gMetaAportado(g,x.id)<x.monto)otras+=gMetaCuota(g,x)}));
  otras=r2(otras);
  return{ing,gasto,otras,sobra:r2(ing-gasto-otras)};
}
function planMeta(x,exclM,exclG){
  const meses=mesesDe(x),falta=Math.max(0,(+x.monto||0)-(+x.ahorrado||0)),dep=depNecesario(x),cap=capacidad(exclM,exclG);
  const o={meses,falta,dep,cap,hecho:falta<=0,alcanza:cap.ing>0&&cap.sobra>=dep};
  if(!o.hecho&&!o.alcanza&&cap.sobra>0){const r=(+x.tasa||0)/1200;let b=+x.ahorrado||0,n=0;while(b<x.monto&&n<600){b=b*(1+r)+cap.sobra;n++}o.nReal=n<600?n:null}
  return o;
}
function veredictoHTML(pl,bk){
  if(pl.hecho)return '<div class="alert good">¡Ya llegaste a tu meta!</div>';
  const c=pl.cap;
